database:
  name: "olist"
  dialect: "sqlite"
  time_anchor: "2018-10-17 17:30:18"

business_rules:
  revenue_definition: "Calculated as SUM(price) from order_items for delivered orders only. Do not sum payment_value to avoid multi-installment/voucher duplication."
  valid_order_status: "order_status = 'delivered'"
  delivery_time_definition: "julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp) in days."
  valid_delivery_definition: "Delivery metrics use delivered orders with a non-null order_delivered_customer_date that is not earlier than order_purchase_timestamp."
  cancellation_rate_definition: "Canceled orders divided by all orders purchased in the period, regardless of status."
  repeat_purchase_rate_definition: "Among distinct customers (customer_unique_id) with at least one delivered order purchased in the period, the share with more than one delivered order in that same period."

tables:
  orders:
    description: "Core table tracking order timeline and status."
    primary_key: "order_id"
    columns:
      order_id: "Unique identifier for each order."
      customer_id: "Foreign key to customers table."
      order_status: "Status (delivered, shipped, canceled, invoiced, etc.)."
      order_purchase_timestamp: "Timestamp when the purchase was placed."
      order_approved_at: "Payment approval timestamp."
      order_delivered_carrier_date: "Timestamp when order was handed to logistics carrier."
      order_delivered_customer_date: "Actual delivery timestamp to customer."
      order_estimated_delivery_date: "Estimated delivery timestamp communicated to customer."

  order_items:
    description: "Line items included in each order, detailing product, seller, price, and shipping cost."
    primary_key: ["order_id", "order_item_id"]
    columns:
      order_id: "Foreign key to orders table."
      order_item_id: "Item sequence number inside order."
      product_id: "Foreign key to products table."
      seller_id: "Foreign key to sellers table."
      shipping_limit_date: "Seller shipping deadline."
      price: "Item price in Brazilian Real (BRL)."
      freight_value: "Shipping cost per item."

  order_payments:
    description: "Payment transactions per order."
    columns:
      order_id: "Foreign key to orders table."
      payment_sequential: "Sequence number of payment installment/split."
      payment_type: "Method (credit_card, boleto, voucher, debit_card)."
      payment_installments: "Number of installments."
      payment_value: "Transaction value in BRL."

  order_reviews:
    description: "Customer feedback and review ratings."
    columns:
      review_id: "Unique review identifier."
      order_id: "Foreign key to orders table."
      review_score: "Rating from 1 to 5 stars."
      review_creation_date: "Timestamp when review questionnaire was sent."
      review_answer_timestamp: "Timestamp when customer completed review."

  customers:
    description: "Customer registry and geographic locations."
    primary_key: "customer_id"
    columns:
      customer_id: "Key per order."
      customer_unique_id: "Unique identifier to track repeat purchases."
      customer_zip_code_prefix: "Zip code prefix."
      customer_city: "Customer city name."
      customer_state: "Two-letter state abbreviation (e.g., SP, RJ)."

  products:
    description: "Product catalog attributes."
    primary_key: "product_id"
    columns:
      product_id: "Unique product identifier."
      product_category_name: "Product category translated into English."
      product_name_lenght: "Length of product name."
      product_description_lenght: "Length of description."
      product_photos_qty: "Number of product photos."
      product_weight_g: "Weight in grams."

  sellers:
    description: "Merchant profiles and locations."
    primary_key: "seller_id"
    columns:
      seller_id: "Unique seller identifier."
      seller_zip_code_prefix: "Seller zip code prefix."
      seller_city: "Seller city name."
      seller_state: "Seller two-letter state abbreviation."

kpis:
  total_revenue:
    description: "Total sales revenue from delivered items."
    sql_template: >
      SELECT ROUND(SUM(oi.price), 2) AS total_revenue
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date);

  order_count:
    description: "Total count of distinct delivered orders, counted from the orders table without joining order_items."
    sql_template: >
      SELECT COUNT(DISTINCT o.order_id) AS total_orders
      FROM orders o
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date);

  average_order_value:
    description: "Average revenue generated per delivered order (AOV)."
    sql_template: >
      SELECT ROUND(SUM(oi.price) / COUNT(DISTINCT o.order_id), 2) AS average_order_value
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date);

  monthly_revenue:
    description: "Monthly revenue trend for delivered orders."
    sql_template: >
      SELECT strftime('%Y-%m', o.order_purchase_timestamp) AS month,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date)
      GROUP BY strftime('%Y-%m', o.order_purchase_timestamp)
      ORDER BY month ASC;

  top_categories_by_revenue:
    description: "Top performing product categories ranked by revenue."
    sql_template: >
      SELECT p.product_category_name AS category,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered'
        AND p.product_category_name IS NOT NULL
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date)
      GROUP BY p.product_category_name
      ORDER BY revenue DESC, category ASC
      LIMIT :limit;

  top_states_by_revenue:
    description: "Top customer states ranked by total purchase value."
    sql_template: >
      SELECT c.customer_state AS state,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date)
      GROUP BY c.customer_state
      ORDER BY revenue DESC, state ASC
      LIMIT :limit;

  cancellation_rate:
    description: "Percentage of canceled orders among all orders purchased in the period, counting every order status in the denominator."
    sql_template: >
      SELECT ROUND(100.0 * SUM(CASE WHEN order_status = 'canceled' THEN 1 ELSE 0 END) / COUNT(*), 2) AS cancellation_rate
      FROM orders
      WHERE (:start_date IS NULL OR order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR order_purchase_timestamp <= :end_date);

  average_delivery_time:
    description: "Average days from order purchase to customer delivery, for delivered orders with a delivery date not earlier than the purchase date."
    sql_template: >
      SELECT ROUND(AVG(julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp)), 2) AS avg_delivery_days
      FROM orders
      WHERE order_status = 'delivered'
        AND order_delivered_customer_date IS NOT NULL
        AND order_delivered_customer_date >= order_purchase_timestamp
        AND (:start_date IS NULL OR order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR order_purchase_timestamp <= :end_date);

  on_time_delivery_rate:
    description: "Percentage of delivered orders that arrived on or before the estimated date, excluding orders with a delivery date earlier than the purchase date."
    sql_template: >
      SELECT ROUND(100.0 * SUM(CASE WHEN order_delivered_customer_date <= order_estimated_delivery_date THEN 1 ELSE 0 END) / COUNT(*), 2) AS on_time_rate
      FROM orders
      WHERE order_status = 'delivered'
        AND order_delivered_customer_date IS NOT NULL
        AND order_delivered_customer_date >= order_purchase_timestamp
        AND (:start_date IS NULL OR order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR order_purchase_timestamp <= :end_date);

  average_review_score:
    description: "Average customer rating score (1 to 5)."
    sql_template: >
      SELECT ROUND(AVG(r.review_score), 2) AS avg_review_score
      FROM orders o
      JOIN (
        SELECT order_id, review_score
        FROM (
          SELECT order_id, review_score,
                 ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY review_answer_timestamp DESC, review_id DESC) AS rn
          FROM order_reviews
        )
        WHERE rn = 1
      ) r ON o.order_id = r.order_id
      WHERE o.order_status = 'delivered'
        AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
        AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date);

  repeat_purchase_rate:
    description: "Percentage of distinct customers with a delivered order in the period who placed more than one delivered order in that same period."
    sql_template: >
      WITH customer_orders AS (
        SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS order_cnt
        FROM customers c
        JOIN orders o ON c.customer_id = o.customer_id
        WHERE o.order_status = 'delivered'
          AND (:start_date IS NULL OR o.order_purchase_timestamp >= :start_date)
          AND (:end_date IS NULL OR o.order_purchase_timestamp <= :end_date)
        GROUP BY c.customer_unique_id
      )
      SELECT ROUND(100.0 * SUM(CASE WHEN order_cnt > 1 THEN 1 ELSE 0 END) / COUNT(*), 2) AS repeat_purchase_rate
      FROM customer_orders;

few_shot_examples:
  - question: "What is the total revenue in 2017?"
    sql: >
      SELECT ROUND(SUM(oi.price), 2) AS total_revenue
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND o.order_purchase_timestamp >= '2017-01-01'
        AND o.order_purchase_timestamp < '2018-01-01';

  - question: "What is the total revenue in November 2017?"
    sql: >
      SELECT ROUND(SUM(oi.price), 2) AS total_revenue
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND o.order_purchase_timestamp >= '2017-11-01'
        AND o.order_purchase_timestamp < '2017-12-01';

  - question: "Which top 5 product categories generated the most revenue?"
    sql: >
      SELECT p.product_category_name AS category, ROUND(SUM(oi.price), 2) AS revenue
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered' AND p.product_category_name IS NOT NULL
      GROUP BY p.product_category_name
      ORDER BY revenue DESC
      LIMIT 5;

  - question: "What is the average review score for health_beauty products?"
    sql: >
      SELECT ROUND(AVG(r.review_score), 2) AS avg_score
      FROM orders o
      JOIN (
        SELECT order_id, review_score
        FROM (
          SELECT order_id, review_score,
                 ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY review_answer_timestamp DESC, review_id DESC) AS rn
          FROM order_reviews
        )
        WHERE rn = 1
      ) r ON o.order_id = r.order_id
      WHERE o.order_status = 'delivered'
        AND EXISTS (
          SELECT 1 FROM order_items oi
          JOIN products p ON oi.product_id = p.product_id
          WHERE oi.order_id = o.order_id AND p.product_category_name = 'health_beauty'
        );

  - question: "How many orders were canceled in total?"
    sql: >
      SELECT COUNT(*) AS canceled_orders
      FROM orders
      WHERE order_status = 'canceled';

  - question: "What are the most popular payment methods used by customers?"
    sql: >
      SELECT op.payment_type,
             COUNT(DISTINCT op.order_id) AS total_orders,
             ROUND(SUM(op.payment_value), 2) AS total_value
      FROM order_payments op
      JOIN orders o ON op.order_id = o.order_id
      WHERE o.order_status = 'delivered'
      GROUP BY op.payment_type
      ORDER BY total_orders DESC;

  - question: "What is the total revenue by customer state?"
    sql: >
      SELECT c.customer_state AS state,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
      GROUP BY c.customer_state
      ORDER BY revenue DESC;

  - question: "Doanh thu của danh mục health_beauty tại bang SP là bao nhiêu?"
    sql: >
      SELECT ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered'
        AND c.customer_state = 'SP'
        AND p.product_category_name = 'health_beauty';

  - question: "Tăng trưởng doanh thu theo tháng (MoM) trong năm 2017 là bao nhiêu?"
    sql: >
      WITH monthly AS (
        SELECT strftime('%Y-%m', o.order_purchase_timestamp) AS month,
               ROUND(SUM(oi.price), 2) AS revenue
        FROM orders o
        JOIN order_items oi ON o.order_id = oi.order_id
        WHERE o.order_status = 'delivered'
          AND o.order_purchase_timestamp >= '2017-01-01'
          AND o.order_purchase_timestamp < '2018-01-01'
        GROUP BY strftime('%Y-%m', o.order_purchase_timestamp)
      )
      SELECT month,
             revenue,
             LAG(revenue) OVER (ORDER BY month) AS prev_revenue,
             ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))
                   / NULLIF(LAG(revenue) OVER (ORDER BY month), 0), 2) AS mom_growth_pct
      FROM monthly
      ORDER BY month ASC;

  - question: "Compare category revenue between 2017 and 2018? (2018 data ends 2018-10-17, so 2018 is partial.)"
    sql: >
      WITH cat_year AS (
        SELECT p.product_category_name AS category,
               strftime('%Y', o.order_purchase_timestamp) AS year,
               ROUND(SUM(oi.price), 2) AS revenue
        FROM orders o
        JOIN order_items oi ON o.order_id = oi.order_id
        JOIN products p ON oi.product_id = p.product_id
        WHERE o.order_status = 'delivered'
          AND p.product_category_name IS NOT NULL
          AND strftime('%Y', o.order_purchase_timestamp) IN ('2017', '2018')
        GROUP BY p.product_category_name, strftime('%Y', o.order_purchase_timestamp)
      )
      SELECT category,
             MAX(CASE WHEN year = '2017' THEN revenue END) AS revenue_2017,
             MAX(CASE WHEN year = '2018' THEN revenue END) AS revenue_2018,
             ROUND(100.0 * (MAX(CASE WHEN year = '2018' THEN revenue END)
                          - MAX(CASE WHEN year = '2017' THEN revenue END))
                   / NULLIF(MAX(CASE WHEN year = '2017' THEN revenue END), 0), 2) AS yoy_growth_pct
      FROM cat_year
      GROUP BY category
      ORDER BY revenue_2017 DESC
      LIMIT 10;

  - question: "Top 5 danh mục có doanh thu cao nhất tại bang SP?"
    sql: >
      SELECT p.product_category_name AS category,
             ROUND(SUM(oi.price), 2) AS revenue
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered'
        AND c.customer_state = 'SP'
        AND p.product_category_name IS NOT NULL
      GROUP BY p.product_category_name
      ORDER BY revenue DESC
      LIMIT 5;

  - question: "Tỷ lệ các loại thanh toán trong các đơn đã giao là bao nhiêu?"
    sql: >
      SELECT op.payment_type,
             COUNT(DISTINCT o.order_id) AS total_orders,
             ROUND(100.0 * COUNT(DISTINCT o.order_id)
                   / (SELECT COUNT(DISTINCT o2.order_id)
                      FROM orders o2
                      JOIN order_payments op2 ON o2.order_id = op2.order_id
                      WHERE o2.order_status = 'delivered'), 2) AS orders_pct
      FROM orders o
      JOIN order_payments op ON o.order_id = op.order_id
      WHERE o.order_status = 'delivered'
      GROUP BY op.payment_type
      ORDER BY total_orders DESC;

  - question: "Có bao nhiêu khách hàng mua lại (>= 2 đơn đã giao)?"
    sql: >
      WITH per_customer AS (
        SELECT c.customer_unique_id,
               COUNT(DISTINCT o.order_id) AS order_cnt
        FROM customers c
        JOIN orders o ON c.customer_id = o.customer_id
        WHERE o.order_status = 'delivered'
        GROUP BY c.customer_unique_id
      )
      SELECT COUNT(*) AS total_customers,
             SUM(CASE WHEN order_cnt > 1 THEN 1 ELSE 0 END) AS repeat_customers,
             ROUND(100.0 * SUM(CASE WHEN order_cnt > 1 THEN 1 ELSE 0 END) / COUNT(*), 2) AS repeat_rate_pct
      FROM per_customer;

  - question: "What is the distribution of review scores on delivered orders?"
    sql: >
      WITH latest_review AS (
        SELECT order_id, review_score
        FROM (
          SELECT order_id, review_score,
                 ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY review_answer_timestamp DESC, review_id DESC) AS rn
          FROM order_reviews
        )
        WHERE rn = 1
      )
      SELECT r.review_score,
             COUNT(*) AS review_count
      FROM orders o
      JOIN latest_review r ON o.order_id = r.order_id
      WHERE o.order_status = 'delivered'
      GROUP BY r.review_score
      ORDER BY r.review_score ASC;

  - question: "Tỷ lệ giao trễ theo từng bang là bao nhiêu?"
    sql: >
      SELECT c.customer_state AS state,
             COUNT(*) AS delivered_orders,
             SUM(CASE WHEN o.order_delivered_customer_date > o.order_estimated_delivery_date THEN 1 ELSE 0 END) AS late_orders,
             ROUND(100.0 * SUM(CASE WHEN o.order_delivered_customer_date > o.order_estimated_delivery_date THEN 1 ELSE 0 END) / COUNT(*), 2) AS late_rate_pct
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      WHERE o.order_status = 'delivered'
        AND o.order_delivered_customer_date IS NOT NULL
        AND o.order_delivered_customer_date >= o.order_purchase_timestamp
      GROUP BY c.customer_state
      ORDER BY late_rate_pct DESC;

  - question: "Thời gian giao hàng trung bình theo từng danh mục sản phẩm?"
    sql: >
      SELECT p.product_category_name AS category,
             ROUND(AVG(julianday(o.order_delivered_customer_date) - julianday(o.order_purchase_timestamp)), 2) AS avg_delivery_days,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered'
        AND o.order_delivered_customer_date IS NOT NULL
        AND o.order_delivered_customer_date >= o.order_purchase_timestamp
        AND p.product_category_name IS NOT NULL
      GROUP BY p.product_category_name
      ORDER BY avg_delivery_days ASC;

  - question: "Which top 10 sellers generated the most revenue?"
    sql: >
      SELECT s.seller_id,
             s.seller_state,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN sellers s ON oi.seller_id = s.seller_id
      WHERE o.order_status = 'delivered'
      GROUP BY s.seller_id, s.seller_state
      ORDER BY revenue DESC
      LIMIT 10;

  - question: "Số đơn bị hủy theo tháng trong năm 2017?"
    sql: >
      SELECT strftime('%Y-%m', order_purchase_timestamp) AS month,
             COUNT(*) AS total_orders,
             SUM(CASE WHEN order_status = 'canceled' THEN 1 ELSE 0 END) AS canceled_orders,
             ROUND(100.0 * SUM(CASE WHEN order_status = 'canceled' THEN 1 ELSE 0 END) / COUNT(*), 2) AS cancel_rate_pct
      FROM orders
      WHERE order_purchase_timestamp >= '2017-01-01'
        AND order_purchase_timestamp < '2018-01-01'
      GROUP BY strftime('%Y-%m', order_purchase_timestamp)
      ORDER BY month ASC;

  - question: "How many orders were paid in each number of installments?"
    sql: >
      SELECT op.payment_installments,
             COUNT(DISTINCT o.order_id) AS orders_count,
             ROUND(SUM(op.payment_value), 2) AS total_value
      FROM orders o
      JOIN order_payments op ON o.order_id = op.order_id
      WHERE o.order_status = 'delivered'
      GROUP BY op.payment_installments
      ORDER BY op.payment_installments ASC;

  - question: "What is the freight-to-price ratio by product category?"
    sql: >
      SELECT p.product_category_name AS category,
             ROUND(SUM(oi.freight_value), 2) AS total_freight,
             ROUND(SUM(oi.price), 2) AS total_price,
             ROUND(100.0 * SUM(oi.freight_value) / NULLIF(SUM(oi.price), 0), 2) AS freight_to_price_pct
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      WHERE o.order_status = 'delivered'
        AND p.product_category_name IS NOT NULL
      GROUP BY p.product_category_name
      ORDER BY freight_to_price_pct DESC
      LIMIT 10;

  - question: "Doanh thu tháng trước là bao nhiêu? (Mốc thời gian trong dữ liệu là 2018-10-17, nên 'tháng trước' là tháng 9/2018.)"
    sql: >
      SELECT ROUND(SUM(oi.price), 2) AS total_revenue
      FROM orders o
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND o.order_purchase_timestamp >= '2018-09-01'
        AND o.order_purchase_timestamp < '2018-10-01';

  - question: "What is the average delivery time by customer state?"
    sql: >
      SELECT c.customer_state AS state,
             ROUND(AVG(julianday(o.order_delivered_customer_date) - julianday(o.order_purchase_timestamp)), 2) AS avg_delivery_days
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      WHERE o.order_status = 'delivered'
        AND o.order_delivered_customer_date IS NOT NULL
        AND o.order_delivered_customer_date >= o.order_purchase_timestamp
      GROUP BY c.customer_state
      ORDER BY avg_delivery_days ASC;

  - question: "Which top 5 cities in SP generated the most revenue?"
    sql: >
      SELECT c.customer_city AS city,
             ROUND(SUM(oi.price), 2) AS revenue,
             COUNT(DISTINCT o.order_id) AS orders_count
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      JOIN order_items oi ON o.order_id = oi.order_id
      WHERE o.order_status = 'delivered'
        AND c.customer_state = 'SP'
      GROUP BY c.customer_city
      ORDER BY revenue DESC
      LIMIT 5;

  - question: "How many delivered orders were placed each month in 2017?"
    sql: >
      SELECT strftime('%Y-%m', order_purchase_timestamp) AS month,
             COUNT(DISTINCT order_id) AS orders_count
      FROM orders
      WHERE order_status = 'delivered'
        AND order_purchase_timestamp >= '2017-01-01'
        AND order_purchase_timestamp < '2018-01-01'
      GROUP BY strftime('%Y-%m', order_purchase_timestamp)
      ORDER BY month ASC;